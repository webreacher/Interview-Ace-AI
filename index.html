    // --- AUDIO PCM TO WAV UTILS FOR GEMINI TTS ---
    function base64ToArrayBuffer(base64) {
      const binaryString = window.atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes.buffer;
    }

    function pcmToWav(pcm16, sampleRate = 24000) {
      const numChannels = 1;
      const byteRate = sampleRate * numChannels * 2;
      const blockAlign = numChannels * 2;
      const dataSize = pcm16.length * 2;
      const buffer = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buffer);

      function writeString(view, offset, string) {
        for (let i = 0; i < string.length; i++) {
          view.setUint8(offset + i, string.charCodeAt(i));
        }
      }

      writeString(view, 0, 'RIFF');
      view.setUint32(4, 36 + dataSize, true);
      writeString(view, 8, 'WAVE');
      writeString(view, 12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, byteRate, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, 16, true);
      writeString(view, 36, 'data');
      view.setUint32(40, dataSize, true);

      let offset = 44;
      for (let i = 0; i < pcm16.length; i++, offset += 2) {
        view.setInt16(offset, pcm16[i], true);
      }
      return new Blob([buffer], { type: 'audio/wav' });
    }

    function resampleAudio(audio, sourceRate, targetRate = 16000) {
      if (sourceRate === targetRate) return audio;

      const sampleCount = Math.round(audio.length * targetRate / sourceRate);
      const resampled = new Float32Array(sampleCount);
      const ratio = sourceRate / targetRate;
      for (let i = 0; i < sampleCount; i++) {
        const position = i * ratio;
        const left = Math.floor(position);
        const right = Math.min(left + 1, audio.length - 1);
        const fraction = position - left;
        resampled[i] = audio[left] * (1 - fraction) + audio[right] * fraction;
      }
      return resampled;
    }

    function mergeTranscriptText(existing, incoming) {
      const previousWords = existing.trim().split(/\s+/).filter(Boolean);
      const nextWords = incoming.trim().split(/\s+/).filter(Boolean);
      const normalize = word => word.toLowerCase().replace(/[.,!?;:]/g, "");
      const maxOverlap = Math.min(12, previousWords.length, nextWords.length);

      for (let overlap = maxOverlap; overlap > 0; overlap--) {
        const previousTail = previousWords.slice(-overlap).map(normalize);
        const nextHead = nextWords.slice(0, overlap).map(normalize);
        if (previousTail.every((word, index) => word === nextHead[index])) {
          return [...previousWords, ...nextWords.slice(overlap)].join(" ");
        }
      }

      return [...previousWords, ...nextWords].join(" ");
    }

      "Customer Success", "Customer Service", "Recruiting", "Talent Acquisition",
      "Human Resources", "Payroll", "Supply Chain", "Project Management",
      "Business Analysis", "Business Intelligence", "Power BI", "Tableau",
      "Microsoft Excel", "Google Analytics", "Public Relations", "Graphic Design",
      "User Research", "Wireframing", "Prototyping", "Adobe Photoshop",
      "Adobe Illustrator", "Communication", "Negotiation", "Event Planning",
      "Inventory Management", "Process Improvement", "Healthcare", "HIPAA",
      "Teaching", "Curriculum Development", "Legal Research", "Contract Management",
      "Data Visualization", "Statistical Analysis", "ETL", "Data Warehousing",
      "Natural Language Processing", "Computer Vision", "Deep Learning",
      "Requirements Gathering", "Stakeholder Management", "Product Strategy"
    ];

    const RESUME_STOP_WORDS = new Set([
      "about", "above", "after", "again", "against", "also", "among", "because",
      "been", "before", "being", "below", "between", "both", "could", "does",
      "during", "each", "from", "further", "have", "having", "into", "itself",
      "more", "most", "other", "over", "same", "should", "some", "such", "than",
      "that", "their", "them", "then", "there", "these", "they", "this", "those",
      "through", "under", "until", "very", "what", "when", "where", "which",
      "while", "with", "would", "your", "using", "used", "work", "worked",
      "working", "responsible", "including", "experience", "years", "year",
      "need", "needs", "build", "building", "reliable", "improve", "improved",
      "role", "required", "requirements", "candidate", "team", "strong", "ability",
      "skills", "looking", "seeking", "join", "help", "support", "new", "ensure",
      "a", "an", "the", "and", "or", "but", "if", "of", "in", "on", "at", "to",
      "for", "by", "as", "is", "are", "was", "were", "be", "been", "being",
      "do", "does", "did", "can", "may", "will", "must", "not", "no", "all",
      "any", "each", "every", "its", "our", "we", "you", "who", "how", "why",
      "what", "when", "where", "which", "while", "within", "across", "per",
      "etc", "via", "able", "well", "related", "relevant", "various", "multiple",
      "including", "include", "includes", "preferred", "preferably", "plus",
      "minimum", "qualification", "qualifications", "responsibility", "responsibilities",
      "description", "overview", "opportunity", "position", "work", "working",
      "company", "organization", "business", "environment", "excellent", "good",
      "great", "ideal", "must-have", "nice-to-have"
    ]);

    const RESUME_ACTION_VERBS = new Set([
      "accelerated", "automated", "built", " launched", "created", "delivered",
      "designed", "developed", "drove", "implemented", "improved", "increased",
      "led", "launched", "optimized", "reduced", "resolved", "scaled", "shipped",
      "streamlined", "engineered", "established", "deployed", "mentored", "owned"
    ].map(verb => verb.trim()));

    function normalizeResumeText(text) {
      return text.toLowerCase().replace(/[^a-z0-9+#.]+/g, " ").replace(/\s+/g, " ").trim();
    }

    function resumeContainsTerm(normalizedText, term) {
      const normalizedTerm = normalizeResumeText(term);
      if (!normalizedTerm) return false;
      const escapedTerm = normalizedTerm.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      return new RegExp(`(^|[^a-z0-9+#])${escapedTerm}(?=$|[^a-z0-9+#])`, "i").test(normalizedText);
    }

    function extractResumeTerms(text) {
      const normalized = normalizeResumeText(text);
      const phrases = RESUME_SKILL_TERMS.filter(skill => resumeContainsTerm(normalized, skill));
      const words = normalized.split(" ").filter(word =>
        word.length > 2 && !RESUME_STOP_WORDS.has(word) && !/^\d+$/.test(word)
      );
      return [...new Set([...phrases, ...words])];
    }

    function detectResumeRole(text) {
      const normalizedText = normalizeResumeText(text);
      const roleTerms = [
        { role: "QA Automation", terms: ["QA Automation", "Test Automation", "Automation Testing", "Automation Tester", "SDET", "Software Development Engineer in Test"] },
        { role: "Quality Assurance", terms: ["Quality Assurance", "QA Analyst", "QA Engineer", "Quality Engineer", "Software Tester", "Manual Testing", "QA"] },
        { role: "Software Engineering", terms: ["Software Engineer", "Software Engineering"] },
        { role: "Data Engineering", terms: ["Data Engineer", "Data Engineering"] },
        { role: "Product Management", terms: ["Product Manager", "Product Management"] },
        { role: "Frontend Engineering", terms: ["Frontend Engineer", "Frontend Developer"] },
        { role: "Backend Engineering", terms: ["Backend Engineer", "Backend Developer"] },
        { role: "Full Stack Engineering", terms: ["Full Stack Engineer", "Full Stack Developer"] },
        { role: "DevOps Engineering", terms: ["DevOps Engineer", "DevOps"] },
        { role: "Machine Learning Engineering", terms: ["Machine Learning Engineer"] },
        { role: "Data Analysis", terms: ["Data Analyst"] },
        { role: "UX Design", terms: ["UX Designer"] },
        { role: "Engineering Management", terms: ["Engineering Manager"] },
        { role: "Business Analysis", terms: ["Business Analyst"] },
        { role: "Project Management", terms: ["Project Manager"] },
        { role: "Cybersecurity", terms: ["Cybersecurity", "Information Security", "Security Analyst", "Security Engineer"] },
        { role: "Human Resources", terms: ["Human Resources", "HR Manager", "Recruiter", "Talent Acquisition"] },
        { role: "Marketing", terms: ["Marketing Manager", "Digital Marketing", "Marketing Specialist"] },
        { role: "Sales", terms: ["Sales Manager", "Sales Representative", "Account Executive"] },
        { role: "Customer Support", terms: ["Customer Support", "Customer Service", "Support Specialist"] },
        { role: "Finance", terms: ["Financial Analyst", "Finance Manager", "Accountant"] },
        { role: "Operations", terms: ["Operations Manager", "Operations Analyst"] },
        { role: "Content Writing", terms: ["Content Writer", "Technical Writer", "Copywriter"] },
        { role: "Graphic Design", terms: ["Graphic Designer", "Visual Designer"] }
      ];

      const titleEnding = "(?:analyst|architect|administrator|artist|accountant|assistant|auditor|chef|consultant|coordinator|designer|developer|director|editor|engineer|illustrator|instructor|lawyer|mechanic|manager|nurse|officer|operator|pharmacist|planner|producer|professor|recruiter|representative|salesperson|scientist|specialist|strategist|teacher|technician|therapist|trainer|writer|executive|controller|inspector)";
      const titlePattern = new RegExp(`\\b((?:[a-z][a-z&./+-]*\\s+){0,4}${titleEnding})\\b`, "i");
      const roleCues = /(?:job title|position|role|hiring|seeking|looking for|join us as)\s*[:,-]?\s*(?:an?\s+)?([^\n.;]{3,100})/i;
      const cueMatch = text.match(roleCues);
      const titleLine = text.split(/\r?\n/).map(line => line.trim()).find(line =>
        line.length <= 100 && titlePattern.test(line)
      );
      const titleMatch = [cueMatch?.[1], titleLine, text]
        .filter(Boolean)
        .map(candidate => candidate.match(titlePattern))
        .find(Boolean);
      if (titleMatch) {
        const title = titleMatch[1]
          .replace(/^(?:(?:a|an|the|for|to|is|our|highly|passionate|experienced|motivated|qualified|talented|skilled|dynamic|dedicated|senior-level|junior-level)\s+)+/i, "")
          .trim()
          .replace(/\b[a-z]/g, character => character.toUpperCase());
        return title.replace(/\bQa\b/g, "QA").replace(/\bUx\b/g, "UX").replace(/\bHr\b/g, "HR");
      }

      const knownRole = roleTerms.find(({ terms }) =>
        terms.some(term => resumeContainsTerm(normalizedText, term))
      )?.role;
      if (knownRole) return knownRole;
      return null;
    }

    function analyzeResumeLocally(resume, jobDescription, fallbackRole) {
      const text = resume.trim();
      const normalizedResume = normalizeResumeText(text);
      const lines = text.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
      const resumeTerms = extractResumeTerms(text);
      const normalizedJobDescription = normalizeResumeText(jobDescription);
      const jobSkillPhrases = jobDescription.trim()
        ? RESUME_SKILL_TERMS.filter(skill => resumeContainsTerm(normalizedJobDescription, skill))
        : [];
      const jobSkillWords = new Set(jobSkillPhrases.flatMap(skill => normalizeResumeText(skill).split(" ")));
      const jobWords = jobDescription.trim()
        ? normalizedJobDescription.split(" ")
          .map(word => word.replace(/^[^a-z0-9+#]+|[^a-z0-9+#]+$/gi, ""))
          .filter(word =>
            word.length > 2 &&
            !RESUME_STOP_WORDS.has(word) &&
            !jobSkillWords.has(word) &&
            !/^\d+$/.test(word)
          )
        : [];
      const jobTerms = [...new Set([...jobSkillPhrases, ...jobWords])];
      const matchedTerms = jobTerms.filter(term => {
        return resumeContainsTerm(normalizedResume, term);
      });
      const missingKeywords = (jobTerms.length
        ? jobTerms.filter(term => !matchedTerms.includes(term))
        : [])
        .slice(0, 8);

      const bulletLines = lines.filter(line => /^[-*•▪]\s+/.test(line));
      const evidenceLines = (bulletLines.length ? bulletLines : lines)
        .filter(line => line.length > 45 && !/^(education|experience|skills|projects|summary|certifications)\b/i.test(line));
      const actionVerbCount = evidenceLines.filter(line =>
        RESUME_ACTION_VERBS.has((line.replace(/^[-*•▪]\s*/, "").match(/[a-z]+/i) || [""])[0].toLowerCase())
      ).length;
      const bulletQuality = evidenceLines.length
        ? Math.min(100, Math.round(35 + (actionVerbCount / evidenceLines.length) * 65))
        : 35;
      const quantifiedLines = evidenceLines.filter(line =>
        /(?:\b\d+(?:[.,]\d+)?\s*(?:%|percent(?:age)?|x|k|m|b|ms|seconds?|minutes?|hours?|users?|requests?|rps|qps|million|billion)\b|\$\s?\d|\b\d{4}\b)/i.test(line)
      ).length;
      const quantifiableImpact = evidenceLines.length
        ? Math.min(100, Math.round(30 + (quantifiedLines / evidenceLines.length) * 70))
        : 30;
      const sectionCount = (text.match(/^\s*(?:summary|profile|experience|work history|education|skills|projects|certifications|achievements)\s*:?/gim) || []).length;
      const wordCount = text.split(/\s+/).filter(Boolean).length;
      const readability = Math.max(20, Math.min(100,
        45 + Math.min(sectionCount, 5) * 7 +
        (wordCount >= 100 && wordCount <= 1200 ? 20 : wordCount > 40 ? 10 : 0) +
        (/\b[\w.+-]+@[\w.-]+\.[a-z]{2,}\b/i.test(text) ? 5 : 0)
      ));
      const keywordMatch = jobTerms.length
        ? Math.round((matchedTerms.length / jobTerms.length) * 100)
        : Math.min(95, 40 + resumeTerms.filter(term =>
          RESUME_SKILL_TERMS.includes(term)
        ).length * 5);
      const atsScore = Math.round(
        keywordMatch * 0.55 + quantifiableImpact * 0.15 + readability * 0.15 + bulletQuality * 0.15
      );

      const candidateName = lines.find(line =>
        line.length <= 60 &&
        !/@|https?:|linkedin|github|resume|curriculum vitae/i.test(line) &&
        !/^(summary|profile|experience|education|skills|projects|certifications)\b/i.test(line)
      ) || "Candidate Profile";
      const detectedRole = detectResumeRole(jobDescription) || detectResumeRole(text) || fallbackRole;
      const topSkills = RESUME_SKILL_TERMS.filter(skill =>
        resumeContainsTerm(normalizedResume, skill)
      ).slice(0, 10);
      const projectsFound = evidenceLines
        .filter(line => /\b(built|developed|designed|implemented|created|led|launched|engineered|deployed|scaled)\b/i.test(line))
        .slice(0, 3)
        .map(line => line.replace(/^[-*•▪]\s*/, ""));
      const claim = projectsFound[0] || evidenceLines[0] || lines.find(line => line.length > 35) || text.slice(0, 180);
      const shortClaim = claim.length > 180 ? `${claim.slice(0, 177)}...` : claim;
      const atsRecommendations = [];

      if (!jobTerms.length) {
        atsRecommendations.push("Paste a target job description for a direct, role-specific keyword match score.");
      }
      if (missingKeywords.length) {
        atsRecommendations.push(`If accurate, add relevant job-description terms: ${missingKeywords.slice(0, 4).join(", ")}.`);
      }
      if (quantifiableImpact < 70) {
        atsRecommendations.push("Add measurable outcomes to experience bullets, such as scale, time saved, cost reduced, or reliability improved.");
      }
      if (bulletQuality < 70) {
        atsRecommendations.push("Start each experience bullet with a specific action verb and state the result you delivered.");
      }
      if (sectionCount < 3) {
        atsRecommendations.push("Use clearly labeled sections for experience, skills, education, and projects to improve ATS readability.");
      }
      if (!atsRecommendations.length) {
        atsRecommendations.push("Keep the resume tailored to the role and verify that every listed skill is supported by a concrete example.");
      }

      const focus = missingKeywords.length
        ? missingKeywords.slice(0, 3).join(", ")
        : `${detectedRole} interview fundamentals`;
      const roadmap = [
        { week: "Week 1", title: "Close the highest-priority skill gaps", desc: `Review the role requirements and build evidence for: ${focus}.`, drills: missingKeywords.slice(0, 3).length ? missingKeywords.slice(0, 3) : topSkills.slice(0, 3), status: "Start here", color: "border-blue-500/40 bg-blue-50/30 dark:bg-blue-950/20" },
        { week: "Week 2", title: "Strengthen measurable impact", desc: "Turn project work into concise results with scale, baseline, and measurable outcomes.", drills: ["Quantify project outcomes", "Explain the baseline and trade-offs", "Practice a concise project walkthrough"], status: "Build evidence", color: "border-indigo-500/40 bg-indigo-50/30 dark:bg-indigo-950/20" },
        { week: "Week 3", title: "Prepare experience-based stories", desc: `Rehearse clear explanations of your real work, starting with: ${shortClaim}`, drills: ["Situation and constraints", "Your decisions and alternatives", "Results and lessons learned"], status: "Practice stories", color: "border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900" },
        { week: "Week 4", title: "Run tailored interview drills", desc: "Practice role-specific technical and behavioral questions, then refine answers using feedback.", drills: ["Technical deep dive", "Behavioral STAR answer", "Final timed mock interview"], status: "Mock interview", color: "border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900" }
      ];
      const tailoredQuestions = [
        { stage: "Resume Project Deep Dive", title: "Walk me through this project and your contribution", description: `Your resume says: "${shortClaim}" What was the problem, what did you personally build, and how did you measure success?`, criteria: "Clear ownership, design choices, and measurable results." },
        { stage: "Technical Trade-offs", title: `Technical decisions in your ${detectedRole} work`, description: `Which tools or approaches from your resume were most important to "${(topSkills.slice(0, 3).join(", ") || detectedRole)}", and what alternatives did you consider?`, criteria: "Technical depth, alternatives, constraints, and trade-offs." },
        { stage: "Impact & Metrics", title: "Quantify the impact of your work", description: `For "${shortClaim}", what changed before and after your work? Which scale, latency, quality, cost, or reliability metrics did you track?`, criteria: "Credible baseline, metric, timeframe, and outcome." },
        { stage: "Problem Solving", title: "Describe a difficult obstacle on this project", description: `What was the hardest failure or bottleneck you encountered while delivering "${shortClaim}", and how did you diagnose and resolve it?`, criteria: "Structured troubleshooting, ownership, and lessons learned." },
        { stage: "Role & Growth", title: `How does your experience prepare you for ${detectedRole}?`, description: `Which experience on your resume best matches this target role, and what would you improve if you repeated that work?`, criteria: "Relevant experience, self-awareness, and role alignment." }
      ];

      return {
        candidateName,
        detectedRole,
        atsScore,
        atsBreakdown: { keywordMatch, quantifiableImpact, readability, bulletQuality },
        topSkills,
        projectsFound,
        missingKeywords,
        atsRecommendations,
        roadmap,
        tailoredQuestions,
        analysisNote: jobTerms.length
          ? `Compared against ${jobTerms.length} keywords extracted from your job description.`
          : "No job description provided; keyword score reflects skills detected in your resume. Add a target JD for a direct match score."
      };
    }

    function evaluateAnswerLocally(question, answer, role, track) {
      const cleanAnswer = answer.trim();
      const normalizedAnswer = cleanAnswer.toLowerCase();
      const words = normalizedAnswer.match(/[a-z0-9+#]+/g) || [];
      const wordCount = words.length;
      const fillerWordCount = (cleanAnswer.match(/\b(um|uh|like|you know|basically|actually)\b/gi) || []).length;
      const ignoredTerms = new Set(
        "about after again align also answer any are because before being between both brief build building can candidate clear could describe did discuss does during each explain feel first for from give goal goals going have help here how into its just key long make me most much must need our out overall personally question role should show tell than that the their then there these they thing this through to toward use using walk want was were what when where which while why will with would your".split(" ")
      );
      const answerTerms = new Set([
        ...words,
        ...(normalizedAnswer.match(/[a-z0-9+#]+(?:-[a-z0-9+#]+)+/g) || [])
      ]);
      const getTerms = text => [...new Set(
        (text || "").toLowerCase().match(/[a-z][a-z0-9+#.-]{3,}/g)?.filter(term => !ignoredTerms.has(term)) || []
      )];
      const aliases = {
        architecture: ["architectural", "design"],
        architectural: ["architecture", "design"],
        design: ["architecture", "architectural"],
        failure: ["fail", "failing", "failed"],
        failover: ["failure", "failed"],
        reliability: ["reliable", "reliability"],
        reliable: ["reliability"],
        consistency: ["consistent"],
        consistent: ["consistency"],
        scalability: ["scale", "scaling", "scalable"],
        scalable: ["scale", "scaling", "scalability"],
        tradeoffs: ["tradeoff", "trade-offs"],
        "trade-offs": ["tradeoff", "tradeoffs"],
        metrics: ["metric", "measure", "measured"],
        measurable: ["measure", "measured", "metric", "metrics"],
        results: ["result", "outcome", "impact"],
        outcome: ["result", "results", "impact"],
        actions: ["action", "acted", "implemented", "led"],
        action: ["actions", "acted", "implemented", "led"],
        constraints: ["constraint", "limitation", "limited"],
        latency: ["p99", "response"],
        throughput: ["rps", "requests", "volume"],
        communication: ["communicated", "stakeholder", "stakeholders"],
        motivation: ["motivated", "interest", "excited"],
        conflict: ["disagreement", "dispute", "resolved"],
        questions: ["ask", "asking", "asked"],
        curiosity: ["ask", "asking", "learn"],
        insightfulness: ["insightful", "ask", "asking"],
        interest: ["interested", "excited", "motivation"],
        alignment: ["align", "aligned", "fit"],
        company: ["team", "organization", "employer"],
        deadline: ["time", "schedule", "delivery"],
        task: ["responsibility", "owned", "goal"],
        situation: ["context", "challenge", "problem"],
        result: ["results", "outcome", "impact"]
      };
      const matches = terms => terms.filter(term =>
        answerTerms.has(term) || (aliases[term] || []).some(alias => answerTerms.has(alias))
      );
      const titleTerms = getTerms(question?.title);
      const criteriaTerms = getTerms(question?.criteria);
      const descriptionTerms = getTerms(question?.description);
      const uniqueExpectedTerms = [...new Set([...titleTerms, ...criteriaTerms, ...descriptionTerms])];
      const matchedTerms = [...new Set([
        ...matches(titleTerms),
        ...matches(criteriaTerms),
        ...matches(descriptionTerms)
      ])];
      const relevanceScore = uniqueExpectedTerms.length
        ? Math.min(100, matchedTerms.length * 10)
        : (wordCount >= 20 ? 50 : 20);
      const sentences = cleanAnswer.split(/[.!?]+/).filter(sentence => sentence.trim().length > 0);
      const hasSpecificEvidence = /\b\d+(?:[.,]\d+)?%?\b/.test(cleanAnswer)
        || /\b(built|designed|implemented|measured|reduced|increased|improved|shipped|led|resolved|tested|deployed|migrated|launched)\b/i.test(cleanAnswer);
      const hasReasoning = /\b(because|therefore|so that|which meant|trade[- ]?off|alternative|instead|however|result(?:ed)? in)\b/i.test(cleanAnswer);
      const hasSequence = /\b(first|then|next|finally|after that|as a result|situation|task|action|result)\b/i.test(cleanAnswer);
      const evidenceScore = Math.min(100,
        (hasSpecificEvidence ? 45 : 0) +
        (hasReasoning ? 30 : 0) +
        (wordCount >= 35 ? 25 : wordCount >= 18 ? 15 : 0)
      );
      const technicalScore = Math.round(relevanceScore * 0.7 + evidenceScore * 0.3);
      const structureScore = Math.min(100,
        15 +
        (sentences.length >= 2 ? 20 : 0) +
        (sentences.length >= 4 ? 15 : 0) +
        (hasSequence ? 25 : 0) +
        (hasReasoning ? 15 : 0) +
        (/\b(situation|task|action|result)\b/i.test(cleanAnswer) ? 10 : 0)
      );
      const deliveryScore = Math.max(10, Math.min(100,
        (wordCount < 8 ? 15 : wordCount < 20 ? 35 : wordCount < 45 ? 60 : wordCount <= 180 ? 82 : 65) -
        Math.min(24, fillerWordCount * 6) +
        (sentences.length > 0 && sentences.length <= Math.ceil(wordCount / 8) ? 8 : 0)
      ));
      let overallScore = Math.round(technicalScore * 0.55 + structureScore * 0.25 + deliveryScore * 0.2);
      if (relevanceScore < 20) overallScore = Math.min(overallScore, 25);
      else if (relevanceScore < 40) overallScore = Math.min(overallScore, 44);
      else if (relevanceScore < 60) overallScore = Math.min(overallScore, 64);
      if (wordCount < 8) overallScore = Math.min(overallScore, 15);

      const strengths = [];
      if (relevanceScore >= 60) strengths.push("Addressed several of the question's key requirements.");
      if (hasSpecificEvidence) strengths.push("Included a concrete action, example, or measurable detail.");
      if (hasReasoning) strengths.push("Explained reasoning or a decision trade-off.");
      if (hasSequence) strengths.push("Used clear sequencing to organize the response.");
      if (!strengths.length) strengths.push("The response was captured and can be improved with a direct, evidence-based answer.");

      const improvements = [];
      if (relevanceScore < 60) {
        const missingTerms = [...criteriaTerms, ...descriptionTerms, ...titleTerms]
          .filter(term => !matchedTerms.includes(term))
          .filter((term, index, terms) => terms.indexOf(term) === index)
          .slice(0, 4);
        improvements.push(missingTerms.length
          ? `Address the question more directly; cover relevant points such as ${missingTerms.join(", ")}.`
          : "Address the question directly before adding background detail.");
      }
      if (!hasSpecificEvidence) improvements.push("Add a specific example, your personal action, and a measurable outcome where possible.");
      if (!hasReasoning) improvements.push("Explain why you chose that approach and mention a trade-off or alternative.");
      if (!hasSequence) improvements.push("Organize the answer into a clear sequence: context, action, and result.");
      if (wordCount < 20) improvements.push("Develop the answer with enough detail to show your reasoning and contribution.");
      if (fillerWordCount > 2) improvements.push(`Reduce filler words; ${fillerWordCount} were detected in the transcript.`);

      const hiringRecommendation = overallScore >= 85
        ? "Strong Hire"
        : overallScore >= 70
        ? "Hire"
        : overallScore >= 50
        ? "Lean Hire"
        : "Do Not Hire";
      const summary = relevanceScore < 20
        ? `This response did not contain clear evidence addressing the question about ${question?.title || role}; the score reflects the lack of relevant content.`
        : `This response included evidence for ${matchedTerms.length} relevant signals and scored ${overallScore}/100. ${overallScore < 50 ? "It needs a more direct, specific answer." : "The feedback below highlights the strongest evidence and next improvements."}`;

      return {
        overallScore,
        hiringRecommendation,
        technicalScore,
        structureScore,
        deliveryScore,
        summary,
        strengths,
        improvements,
        modelAnswer: `A strong answer should directly address: "${question?.title || "the interview question"}". Explain the relevant context, your specific actions and reasoning, then the outcome and what you learned. Use accurate details from your own experience; do not claim results or technical choices you cannot support.`,
        fillerWordCount,
        matchedTerms,
        relevanceScore,
        wordCount
      };
    }

    function aggregateInterviewFeedback(history) {
      const average = key => Math.round(history.reduce((total, item) => total + item.feedback[key], 0) / history.length);
      const overallScore = average("overallScore");
      const recommendations = history.map(item => item.feedback.hiringRecommendation);
      const hiringRecommendation = overallScore >= 85
        ? "Strong Hire"
        : overallScore >= 70
        ? "Hire"
        : overallScore >= 50
        ? "Lean Hire"
        : "Do Not Hire";
      const weakest = [...history].sort((a, b) => a.feedback.overallScore - b.feedback.overallScore)[0];
      return {
        overallScore,
        hiringRecommendation,
        technicalScore: average("technicalScore"),
        structureScore: average("structureScore"),
        deliveryScore: average("deliveryScore"),
        summary: `Final review based on ${history.length} evaluated ${history.length === 1 ? "answer" : "answers"}: average score ${overallScore}/100. ${recommendations.filter(item => item === "Do Not Hire").length} answer(s) received a Do Not Hire rating. The area to revisit first is "${weakest.question}".`,
        strengths: [...new Set(history.flatMap(item => item.feedback.strengths))].slice(0, 4),
        improvements: [...new Set(history.flatMap(item => item.feedback.improvements))].slice(0, 4),
        modelAnswer: "Review the per-question results below. Use the feedback to prepare accurate examples that directly address each question, explain your decisions, and state measurable outcomes.",
        fillerWordCount: history.reduce((total, item) => total + item.feedback.fillerWordCount, 0)
      };
    }

    // --- MAIN APP COMPONENT ---
    function App() {

      // Instant In-line Critique state
      const [instantFeedback, setInstantFeedback] = useState(null);

      // TTS Settings
      const [ttsVoice, setTtsVoice] = useState("Kore");
      const [autoSpeakQuestion, setAutoSpeakQuestion] = useState(false);
      const [isSpeaking, setIsSpeaking] = useState(false);
      const [isGeneratingAudio, setIsGeneratingAudio] = useState(false);

      // STT State & Audio Levels
      const [isRecording, setIsRecording] = useState(false);
      const [isPreparingSpeech, setIsPreparingSpeech] = useState(false);
      const [audioLevel, setAudioLevel] = useState(0);

      // Interview Session State
      const [sessionStage, setSessionStage] = useState(0);
      const [activeQuestion, setActiveQuestion] = useState(null);
      const [userResponse, setUserResponse] = useState("");
      const [transcriptHistory, setTranscriptHistory] = useState([]);
      const [cameraActive, setCameraActive] = useState(true);
      const [cameraNotice, setCameraNotice] = useState(null);
      const [timerSeconds, setTimerSeconds] = useState(180);
      const [isTimerRunning, setIsTimerRunning] = useState(false);
      const [isAIEvaluating, setIsAIEvaluating] = useState(false);
      const [speechNotice, setSpeechNotice] = useState(null);

      // Scorecard / Feedback State
      const [latestFeedback, setLatestFeedback] = useState(null);
      const [isFinalReview, setIsFinalReview] = useState(false);
      const [savedSessions, setSavedSessions] = useState([
        {
          id: "sess-101",
          date: "Yesterday, 4:15 PM",
          role: "Senior Software Engineer",
          score: 89,
          scores: { technical: 92, structure: 86, communication: 88 },
          duration: "14m 20s",
          status: "Strong Hire"
        },
        {
          id: "sess-100",
          date: "Oct 21, 2:30 PM",
          role: "Staff Infrastructure Architect",
          score: 81,
          scores: { technical: 84, structure: 75, communication: 82 },
          duration: "18m 45s",
          status: "Lean Hire"
        }
      ]);

      const videoRef = useRef(null);
      const timerRef = useRef(null);
      const audioPlayerRef = useRef(null);
      const currentUtteranceRef = useRef(null);

      // Audio capture & STT references
      const audioStreamRef = useRef(null);
      const audioContextRef = useRef(null);
      const analyserRef = useRef(null);
      const speechProcessorRef = useRef(null);
      const speechPipelineRef = useRef(null);
      const speechPipelinePromiseRef = useRef(null);
      const speechAudioChunksRef = useRef([]);
      const speechAudioLengthRef = useRef(0);
      const speechQueueRef = useRef(Promise.resolve());
      const speechSessionRef = useRef(0);
      const isStartingSpeechRef = useRef(false);
      const animFrameRef = useRef(null);
      const baseResponseRef = useRef("");
      const finalTranscriptRef = useRef("");
      const isListeningRef = useRef(false);

      // Synchronize theme with HTML document tag
      useEffect(() => {
        if (isDarkMode) {
          document.documentElement.classList.add('dark');

      const resetInterviewReview = () => {
        setTranscriptHistory([]);
        setLatestFeedback(null);
        setIsFinalReview(false);
        setUserResponse("");
        setInstantFeedback(null);
      };

      // Direct mock interview track launcher (Opens simulator directly with preconfigured track)
      const startMockInterviewWithTrack = (trackName) => {
        setSelectedTrack(trackName);
        setUseResumeQuestions(false);
        setSessionStage(0);
        resetInterviewReview();

        if (trackName === "HR") {
          setActiveQuestion({
            stage: "HR Round • Culture & Fit",

            criteria: "Cultural alignment, clear career narrative, authentic motivation, and team communication."
          });
        } else if (trackName === "Behavioral") {
          setActiveQuestion({
            stage: "Behavioral Round • STAR Format",
            title: "Tell me about a high-pressure deadline or team conflict you navigated",
            description: "Using the STAR method (Situation, Task, Action, Result), describe a challenging interpersonal disagreement or critical roadblock. How did you de-escalate and deliver?",
            criteria: "Structured STAR response, empathy, conflict resolution, accountability, and measurable results."
          });
        } else {
          setActiveQuestion({
            stage: "Technical Round • Architecture & Depth",
            title: `Technical Deep-Dive: Architecture for ${focusArea}`,
            description: `Walk me through your architectural choices when building a mission-critical subsystem for ${focusArea} at high throughput and fault tolerance.`,
            criteria: "Scalability, trade-off articulation, failure modes, data consistency, and p99 SLA handling."
          });
        }

        setTimerSeconds(180);
        setCurrentView("simulator");

        if (autoSpeakQuestion) {
          setTimeout(() => {
            speakText("Welcome to your interview. Let's begin with the first question.");
          }, 400);
        }
      };

      // Initialize default active question
      useEffect(() => {
        loadQuestionForStage(0, false);
      }, [role, level, focusArea, useResumeQuestions, resumeQuestions]);

      // Simulate vision posture/eye contact updates periodically when in simulator
      useEffect(() => {
        if (currentView !== "simulator") return;
        const interval = setInterval(() => {
          setEyeContactScore(prev => Math.min(98, Math.max(76, prev + (Math.random() > 0.5 ? 2 : -2))));
          if (isRecording) {
            setSpeakingPaceWpm(prev => Math.min(165, Math.max(120, prev + (Math.random() > 0.5 ? 4 : -4))));
          }
        }, 3500);
        return () => clearInterval(interval);
      }, [currentView, isRecording]);

      // Extract readable text from supported resume formats.
      const handleFileUpload = async (e) => {
        const input = e.target;
        const file = input.files?.[0];
        input.value = "";
        if (!file) return;

        setResumeNotice(null);
        setResumeText("");
        setResumeFileName(file.name);
        setResumeParsed(null);
        setResumeQuestions([]);
        setUseResumeQuestions(false);

        if (file.size > 10 * 1024 * 1024) {
          setResumeNotice({ type: "warning", text: "Choose a resume smaller than 10 MB." });
          return;
        }

        const extension = file.name.split(".").pop()?.toLowerCase();
        try {
          let extractedText = "";
          if (extension === "txt" || extension === "md") {
            extractedText = await file.text();
          } else if (extension === "pdf") {
            if (!window.pdfjsLib) throw new Error("The PDF reader could not be loaded. Check your internet connection and reload the page.");
            window.pdfjsLib.GlobalWorkerOptions.workerSrc =
              "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
            const pdf = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
            const pages = [];
            for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
              const page = await pdf.getPage(pageNumber);
              const content = await page.getTextContent();
              pages.push(content.items.map(item => `${item.str || ""}${item.hasEOL ? "\n" : " "}`).join("").trim());
            }
            extractedText = pages.join("\n");
          } else if (extension === "docx") {
            if (!window.mammoth) throw new Error("The DOCX reader could not be loaded. Check your internet connection and reload the page.");
            const result = await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
            extractedText = result.value;
          } else if (extension === "doc") {
            throw new Error("Legacy .doc files are not supported. Save the document as PDF, DOCX, or TXT and upload it again.");
          } else {
            throw new Error("Unsupported file type. Upload a PDF, DOCX, TXT, or Markdown resume.");
          }

          extractedText = extractedText
            .replace(/\u0000/g, "")
            .replace(/[ \t]+\n/g, "\n")
            .replace(/\n{3,}/g, "\n\n")
            .trim();
          if (extractedText.length < 30) {
            throw new Error("No readable text was found. If this is a scanned/image-only PDF, run OCR first and upload a text-based PDF.");
          }

          setResumeText(extractedText);
          setResumeFileName(file.name);
          setResumeNotice({
            type: "success",
            text: `Extracted ${extractedText.split(/\s+/).filter(Boolean).length} words from ${file.name}. Review the text, then calculate your ATS score.`
          });
        } catch (error) {
          console.warn("Resume upload failed:", error);
          setResumeFileName("");
          setResumeNotice({ type: "warning", text: error.message || "Could not read this resume file." });
        }
      };

      // Calculate ATS results and generate drills directly from the resume and target job description.
      const analyzeResume = async () => {
        if (!resumeText.trim()) {
          setResumeNotice({ type: "warning", text: "Upload or paste readable resume text before calculating the ATS score." });
          return;
        }

        setIsAnalyzingResume(true);
        setResumeNotice(null);
        try {
          const parsed = analyzeResumeLocally(resumeText, jobDescription, role);
          setResumeParsed(parsed);
          setResumeQuestions(parsed.tailoredQuestions);
          setUseResumeQuestions(true);
          setSessionStage(0);
          resetInterviewReview();
          setActiveQuestion(parsed.tailoredQuestions[0]);
          setResumeNotice({
            type: "success",
            text: `ATS analysis complete: ${parsed.atsScore}/100. ${parsed.analysisNote}`
          });
        } catch (error) {
          console.error("Resume analysis failed:", error);
          setResumeNotice({ type: "warning", text: "Could not analyze this resume. Check the text and try again." });
        } finally {
          setIsAnalyzingResume(false);
        }
      };

      // Instant Coaching Roast / Feedback
      const handleInstantFeedback = async () => {
        if (!userResponse.trim()) {
          setSpeechNotice({
            type: "warning",
            text: "Please record or type part of your answer first to get instant feedback."
          });
          return;
        }

        setIsGeneratingInstantFeedback(true);
        const prompt = `You are a real-time speech and technical interview coach. Give rapid, punchy, bullet-pointed feedback on this candidate's draft answer as they speak.
Target Role: ${level} ${role}
Question: "${activeQuestion?.title} - ${activeQuestion?.description}"
Draft Candidate Answer:
"${userResponse}"

Return ONLY a JSON response:
{
  "quickScore": number (0-100),
  "verdict": "On Track" | "Needs Specifics" | "Too Vague" | "Great Depth",
  "instantTips": ["tip 1 (e.g. mention concrete metrics/SLAs)", "tip 2 (e.g. avoid saying basically)"],
  "missingKeywords": ["keyword1", "keyword2", "keyword3"],
  "encouragement": "one punchy motivating sentence"
}`;

        try {
          const apiKey = "";
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
          const response = await fetch(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { responseMimeType: "application/json" }
            })
          });

          const data = await response.json();
          const parsed = JSON.parse(data.candidates[0].content.parts[0].text);
          setInstantFeedback(parsed);
        } catch (err) {
          console.warn("Instant critique fallback:", err);
          const words = userResponse.trim().split(/\s+/).length;
          setInstantFeedback({
            quickScore: Math.min(88, Math.max(55, words * 2)),
            verdict: words > 30 ? "On Track" : "Too Brief",
            instantTips: [
              "Quantify your impact (e.g., mention p99 latency or throughput numbers).",
              "Clearly articulate the trade-offs (why Option A instead of Option B)."
            ],
            missingKeywords: ["Trade-offs", "Idempotency", "p99 SLA", "Telemetry"],
            encouragement: "Good start! Expand on your failure recovery mechanism."
          });
        } finally {
          setIsGeneratingInstantFeedback(false);
        }
      };

      // Stop speech on view change
      useEffect(() => {
        stopTTS();
        if (isRecording || isStartingSpeechRef.current) {
          stopAudioRecording();
        }
      }, [currentView, sessionStage]);

      // Timer Effect
      useEffect(() => {
        if (isTimerRunning && timerSeconds > 0) {
          timerRef.current = setInterval(() => {
            setTimerSeconds(prev => (prev > 0 ? prev - 1 : 0));
          }, 1000);
        } else {
          clearInterval(timerRef.current);
        }
        return () => clearInterval(timerRef.current);
      }, [isTimerRunning, timerSeconds]);

      // Webcam activation
      useEffect(() => {
        let cancelled = false;
        let stream = null;

        if (!cameraActive || currentView !== "simulator") {
          setCameraNotice(null);
          return () => {
            cancelled = true;
          };
        }

        if (!navigator.mediaDevices?.getUserMedia) {
          setCameraNotice({
            type: "warning",
            text: "Camera access requires HTTPS or localhost. Open this app from a secure connection."
          });
          return () => {
            cancelled = true;
          };
        }

        setCameraNotice({ type: "info", text: "Opening camera..." });
        navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: false
        }).then(async cameraStream => {
          if (cancelled) {
            cameraStream.getTracks().forEach(track => track.stop());
            return;
          }

          stream = cameraStream;
          if (!videoRef.current) {
            throw new Error("Camera preview element is unavailable");
          }

          videoRef.current.srcObject = cameraStream;
          const playPromise = videoRef.current.play();
          if (playPromise) {
            playPromise.catch(error => {
              if (cancelled) return;
              console.error("Camera preview playback failed:", error);
              setCameraNotice({
                type: "warning",
                text: "The camera connected, but the preview could not play. Check browser permissions and try again."
              });
            });
          }
          setCameraNotice(null);
        }).catch(error => {
          if (stream) {
            if (videoRef.current?.srcObject === stream) {
              videoRef.current.srcObject = null;
            }
            stream.getTracks().forEach(track => track.stop());
            stream = null;
          }
          if (cancelled) return;

          console.error("Camera preview failed:", error);
          const message = error.name === "NotAllowedError" || error.name === "SecurityError"
            ? "Camera permission was denied or blocked. Allow camera access in your browser and try again."
            : error.name === "NotFoundError" || error.name === "DevicesNotFoundError"
              ? "No camera was found. Connect a camera and try again."
              : error.name === "NotReadableError" || error.name === "TrackStartError"
                ? "The camera is already in use by another app. Close it there and try again."
                : "The camera could not be opened. Check your camera connection and browser permissions.";
          setCameraNotice({ type: "warning", text: message });
        });

        return () => {
          cancelled = true;
          if (stream) {
            stream.getTracks().forEach(track => track.stop());
          }
          if (videoRef.current?.srcObject === stream) {
            videoRef.current.srcObject = null;
          }
        };
      }, [cameraActive, currentView]);

      // Cleanup
      useEffect(() => {
        return () => {
          stopAudioRecording();
          if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
          if (audioContextRef.current && audioContextRef.current.state !== 'closed') {
            audioContextRef.current.close().catch(() => {});
          }
        };
      }, []);

      // --- ON-DEVICE SPEECH-TO-TEXT ---
      const getLocalSpeechPipeline = () => {
        if (speechPipelineRef.current) return Promise.resolve(speechPipelineRef.current);
        if (speechPipelinePromiseRef.current) return speechPipelinePromiseRef.current;

        speechPipelinePromiseRef.current = import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2")
          .then(({ pipeline, env }) => {
            env.allowLocalModels = false;
            env.useBrowserCache = true;
            return pipeline(
              "automatic-speech-recognition",
              "onnx-community/whisper-tiny.en",
              {
                dtype: "q8",
                device: "wasm",
                progress_callback: (progress) => {
                  if (progress.status === "progress" && Number.isFinite(progress.progress)) {
                    setSpeechNotice({
                      type: "info",
                      text: `Downloading local speech model: ${Math.round(progress.progress)}% (first use only)`
                    });
                  }
                }
              }
            );
          })
          .then(transcriber => {
            speechPipelineRef.current = transcriber;
            return transcriber;
          })
          .catch(error => {
            speechPipelinePromiseRef.current = null;
            throw error;
          });

        return speechPipelinePromiseRef.current;
      };

      const transcribeSpeechChunk = (samples, sampleRate, sessionId) => {
        if (samples.length < sampleRate * 0.75) return;
        const audio = resampleAudio(samples, sampleRate);
        let energy = 0;
        for (const sample of audio) energy += sample * sample;
        if (Math.sqrt(energy / audio.length) < 0.004) return;

        speechQueueRef.current = speechQueueRef.current.then(async () => {
          if (sessionId !== speechSessionRef.current) return;
          setSpeechNotice({ type: "info", text: "Transcribing audio locally..." });
          const result = await speechPipelineRef.current(audio);
          if (sessionId !== speechSessionRef.current) return;

          const transcript = result.text?.trim();
          if (transcript) {
            finalTranscriptRef.current = mergeTranscriptText(finalTranscriptRef.current, transcript);
            const response = [baseResponseRef.current, finalTranscriptRef.current].filter(Boolean).join(" ");
            setUserResponse(response);
          }

          setSpeechNotice({
            type: isListeningRef.current ? "info" : "success",
            text: isListeningRef.current ? "Listening and transcribing on this device." : "Transcription complete."
          });
        }).catch(error => {
          if (sessionId !== speechSessionRef.current) return;
          console.error("Local speech transcription failed:", error);
          stopAudioRecording();
          setSpeechNotice({
            type: "warning",
            text: "Local transcription failed. Check that the speech model downloaded correctly, then try again."
          });
        });
      };

      const collectSpeechSamples = (samples, sampleRate, sessionId) => {
        speechAudioChunksRef.current.push(samples);
        speechAudioLengthRef.current += samples.length;
        if (speechAudioLengthRef.current < sampleRate * 12) return;

        const audio = new Float32Array(speechAudioLengthRef.current);
        let offset = 0;
        for (const chunk of speechAudioChunksRef.current) {
          audio.set(chunk, offset);
          offset += chunk.length;
        }

        const overlapLength = Math.min(Math.floor(sampleRate), audio.length);
        const overlap = audio.slice(audio.length - overlapLength);
        speechAudioChunksRef.current = [overlap];
        speechAudioLengthRef.current = overlap.length;
        transcribeSpeechChunk(audio, sampleRate, sessionId);
      };

      const startAudioRecording = async () => {
        if (isListeningRef.current || isPreparingSpeech) return;
        if (!navigator.mediaDevices?.getUserMedia) {
          setSpeechNotice({
            type: "warning",
            text: "Microphone access requires HTTPS or localhost. Open this app from a secure connection."
          });
          return;
        }

        const sessionId = speechSessionRef.current + 1;
        speechSessionRef.current = sessionId;
        isStartingSpeechRef.current = true;
        setIsPreparingSpeech(true);
        setSpeechNotice({
          type: "info",
          text: "Preparing local speech recognition. The ~40 MB model downloads once; your audio stays on this device."
        });
        baseResponseRef.current = userResponse.trim();
        finalTranscriptRef.current = "";
        speechAudioChunksRef.current = [];
        speechAudioLengthRef.current = 0;
        stopTTS();

        try {
          await getLocalSpeechPipeline();
          if (sessionId !== speechSessionRef.current) return;

          const stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
          });
          if (sessionId !== speechSessionRef.current) {
            stream.getTracks().forEach(track => track.stop());
            return;
          }
          audioStreamRef.current = stream;

          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) throw new Error("Web Audio is not supported");
          const ctx = new AudioCtx();
          audioContextRef.current = ctx;
          await ctx.resume();

          const source = ctx.createMediaStreamSource(stream);
          const analyser = ctx.createAnalyser();
          analyser.fftSize = 64;
          analyser.smoothingTimeConstant = 0.6;
          source.connect(analyser);
          analyserRef.current = analyser;

          const processor = ctx.createScriptProcessor(4096, 1, 1);
          processor.onaudioprocess = event => {
            const output = event.outputBuffer.getChannelData(0);
            output.fill(0);
            if (!isListeningRef.current || sessionId !== speechSessionRef.current) return;
            collectSpeechSamples(
              new Float32Array(event.inputBuffer.getChannelData(0)),
              ctx.sampleRate,
              sessionId
            );
          };
          source.connect(processor);
          processor.connect(ctx.destination);
          speechProcessorRef.current = processor;

          const updateVisualizer = () => {
            if (!analyserRef.current) return;
            const dataArray = new Uint8Array(analyserRef.current.frequencyBinCount);
            analyserRef.current.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
            setAudioLevel(Math.min(100, Math.round((sum / dataArray.length / 128) * 100)));
            animFrameRef.current = requestAnimationFrame(updateVisualizer);
          };
          updateVisualizer();

          isStartingSpeechRef.current = false;
          isListeningRef.current = true;
          setIsPreparingSpeech(false);
          setIsRecording(true);
          setIsTimerRunning(true);
          setSpeechNotice({ type: "info", text: "Listening and transcribing on this device." });
        } catch (error) {
          console.error("Local speech setup failed:", error);
          stopAudioRecording();
          const message = error.name === "NotAllowedError" || error.name === "SecurityError"
            ? "Microphone permission was denied. Allow microphone access and try again."
            : error.name === "NotFoundError" || error.name === "DevicesNotFoundError"
              ? "No microphone was found. Connect a microphone and try again."
              : "Could not start local speech recognition. Check your connection for the first model download and try again.";
          setSpeechNotice({ type: "warning", text: message });
        } finally {
          if (sessionId === speechSessionRef.current) {
            isStartingSpeechRef.current = false;
            setIsPreparingSpeech(false);
          }
        }
      };

      const stopAudioRecording = () => {
        if (isStartingSpeechRef.current) {
          speechSessionRef.current += 1;
          isStartingSpeechRef.current = false;
        }
        isListeningRef.current = false;
        setIsPreparingSpeech(false);
        setIsRecording(false);
        setAudioLevel(0);

        if (animFrameRef.current) {
          cancelAnimationFrame(animFrameRef.current);
          animFrameRef.current = null;
        }

        if (speechProcessorRef.current) {
          speechProcessorRef.current.onaudioprocess = null;
          speechProcessorRef.current.disconnect();
          speechProcessorRef.current = null;
        }

        const ctx = audioContextRef.current;
        const hasPendingAudio = ctx && speechAudioLengthRef.current > ctx.sampleRate * 1.5;
        if (hasPendingAudio) {
          const pendingAudio = new Float32Array(speechAudioLengthRef.current);
          let offset = 0;
          for (const chunk of speechAudioChunksRef.current) {
            pendingAudio.set(chunk, offset);
            offset += chunk.length;
          }
          transcribeSpeechChunk(pendingAudio, ctx.sampleRate, speechSessionRef.current);
        }
        speechAudioChunksRef.current = [];
        speechAudioLengthRef.current = 0;

        if (audioStreamRef.current) {
          audioStreamRef.current.getTracks().forEach(track => track.stop());
          audioStreamRef.current = null;
        }

        analyserRef.current = null;
        if (ctx && ctx.state !== "closed") {
          ctx.close().catch(error => {
            console.warn("Audio context cleanup failed:", error);
          });
        }
        audioContextRef.current = null;
        if (!hasPendingAudio) {
          setSpeechNotice({ type: "info", text: "Microphone stopped." });
        }
      };

      const toggleSpeechToText = () => {
        if (isRecording) {
          stopAudioRecording();
        } else {
          startAudioRecording();
        }
      };

      // --- TTS ENGINE ---
      const stopTTS = () => {
        if (audioPlayerRef.current) {
          audioPlayerRef.current.pause();
          audioPlayerRef.current.currentTime = 0;
          audioPlayerRef.current = null;
        }
        if (window.speechSynthesis) {
          window.speechSynthesis.cancel();
        }
        currentUtteranceRef.current = null;
        setIsSpeaking(false);
        setIsGeneratingAudio(false);
      };

      const speakText = async (textToSpeak, customInstruction = "") => {
        if (!textToSpeak || !textToSpeak.trim()) return;

        if (isSpeaking) {
          stopTTS();
          return;
        }

        stopTTS();
        setIsGeneratingAudio(true);

        const promptText = customInstruction 
          ? `${customInstruction}: ${textToSpeak}`
          : `Say in an authoritative yet encouraging executive interviewer tone: ${textToSpeak}`;

        const payload = {
          contents: [{ parts: [{ text: promptText }] }],
          generationConfig: {
            responseModalities: ["AUDIO"],
            speechConfig: {
              voiceConfig: {
                prebuiltVoiceConfig: { voiceName: ttsVoice || "Kore" }
              }
            }
          },
          model: "gemini-2.5-flash-preview-tts"
        };

        try {
          const apiKey = "";
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;
          
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 6000);

          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
            signal: controller.signal
          });
          clearTimeout(timeoutId);

          if (!response.ok) throw new Error(`TTS failed: ${response.status}`);

          const result = await response.json();
          const part = result?.candidates?.[0]?.content?.parts?.[0];
          const audioBase64 = part?.inlineData?.data;
          const mimeType = part?.inlineData?.mimeType || "";

          if (audioBase64) {
            const rateMatch = mimeType.match(/rate=(\d+)/);
            const sampleRate = rateMatch ? parseInt(rateMatch[1], 10) : 24000;
            const pcmBuffer = base64ToArrayBuffer(audioBase64);
            const pcm16 = new Int16Array(pcmBuffer);
            const wavBlob = pcmToWav(pcm16, sampleRate);
            const audioUrl = URL.createObjectURL(wavBlob);

            const audio = new Audio(audioUrl);
            audioPlayerRef.current = audio;

            audio.onplay = () => {
              setIsSpeaking(true);
              setIsGeneratingAudio(false);
            };

            audio.onended = () => {
              setIsSpeaking(false);
              URL.revokeObjectURL(audioUrl);
            };

            audio.onerror = () => {
              setIsSpeaking(false);
              setIsGeneratingAudio(false);
              fallbackBrowserTTS(textToSpeak);
            };

            const playPromise = audio.play();
            if (playPromise !== undefined) {
              playPromise.catch(() => fallbackBrowserTTS(textToSpeak));
            }
            return;
          } else {
            throw new Error("No inline audio");
          }
        } catch (error) {
          fallbackBrowserTTS(textToSpeak);
        }
      };

      const fallbackBrowserTTS = (text) => {
        setIsGeneratingAudio(false);
        if (!window.speechSynthesis) {
          setIsSpeaking(false);
          return;
        }

        window.speechSynthesis.cancel();
        const cleanText = text.replace(/[*#`_]/g, ' ').replace(/\s+/g, ' ').trim();
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        
        const voices = window.speechSynthesis.getVoices();
        const preferredVoice = voices.find(v => v.lang.startsWith("en") && (v.name.includes("Natural") || v.name.includes("Google") || v.name.includes("Samantha") || v.name.includes("Daniel")));
        if (preferredVoice) utterance.voice = preferredVoice;

        utterance.onstart = () => setIsSpeaking(true);
        utterance.onend = () => setIsSpeaking(false);
        utterance.onerror = () => setIsSpeaking(false);

        currentUtteranceRef.current = utterance;
        setIsSpeaking(true);
        window.speechSynthesis.speak(utterance);
      };

            criteria: "Graceful degradation, caching layers, idempotency, user experience impact."

                  </div>

                    <div

                        <span>Tip: Include quantitative metrics ($ saved, % latency drop, scale) for highest ATS score.</span>

                    </div>

                      onClick={analyzeResume}

                      </div>

                          <span>Practice These Questions</span>
                          <Icon name="arrow-right" className="w-3.5 h-3.5" />
                        </button>

                          <span className="font-mono text-blue-600 dark:text-blue-400">{resumeParsed.atsBreakdown?.keywordMatch ?? 0}%</span>

                          <div className="bg-blue-500 h-full rounded-full" style={{ width: `${resumeParsed.atsBreakdown?.keywordMatch ?? 0}%` }}></div>
                        </div>
                      </div>

                      <div className="p-4 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-1.5">
                        <div className="flex justify-between text-xs font-semibold text-slate-600 dark:text-slate-400">

                          <span className="font-mono text-indigo-600 dark:text-indigo-400">{resumeParsed.atsBreakdown?.quantifiableImpact ?? 0}%</span>
                        </div>

                          <div className="bg-indigo-500 h-full rounded-full" style={{ width: `${resumeParsed.atsBreakdown?.quantifiableImpact ?? 0}%` }}></div>
                        </div>
                      </div>

                          <span>Formatting & Flow</span>
                          <span className="font-mono text-emerald-600 dark:text-emerald-400">{resumeParsed.atsBreakdown?.readability ?? 0}%</span>

                          <span className="font-mono text-amber-600 dark:text-amber-400">{resumeParsed.atsBreakdown?.bulletQuality ?? 0}%</span>

                          <div className="bg-amber-500 h-full rounded-full" style={{ width: `${resumeParsed.atsBreakdown?.bulletQuality ?? 0}%` }}></div>
                        </div>
                      </div>
                    </div>

                          <p className="text-xs text-slate-500 dark:text-slate-400">No notable keyword gaps were detected.</p>

                          </>

                      <div className="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-3">

                        <ul className="space-y-2 text-xs text-slate-600 dark:text-slate-400">
                          {resumeParsed.atsRecommendations?.map((recommendation, index) => <li key={index}>• {recommendation}</li>)}

                      </div>
                    </div>

                              className="shrink-0 px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs shadow-sm flex items-center gap-1"
                            >
                              <span>Practice</span>
                              <Icon name="play" className="w-3 h-3" />
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {(resumeParsed?.roadmap?.length ? resumeParsed.roadmap : [
                    {
                      week: "Week 1",
                      title: "Distributed Architectures & High-Throughput Ingestion",
                      desc: "Partitioning strategies, Kafka log compaction, event ordering, idempotency keys, and stream joins.",
                      drills: ["Design rate limiters", "Sharding & Read-Replicas", "CAP theorem real tradeoffs"],
                      status: "Completed (92% Score)",
                      color: "border-blue-500/40 bg-blue-50/30 dark:bg-blue-950/20"
                    },
                    {
                      week: "Week 2",
                      title: "Fault Tolerance, Telemetry & Caching Patterns",
                      desc: "Mitigating thundering herds, probabilistic early expiration (XFetch), circuit breakers, and sub-10ms p99 SLAs.",
                      drills: ["Cache stampede simulation", "Envoy mesh retries", "Graceful degradation under partition"],
                      status: "Current Active Focus",
                      color: "border-indigo-500/40 bg-indigo-50/30 dark:bg-indigo-950/20"
                    },
                    {
                      week: "Week 3",
                      title: "Executive STAR Behavioral Framing & Conflict",
                      desc: "Crafting memorable narratives on scope negotiation, disagree-and-commit technical debates, and production postmortems.",
                      drills: ["Incident retrospective", "Handling non-technical stakeholders", "Architectural dissent"],
                      status: "Upcoming",
                      color: "border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900"
                    },
                    {
                      week: "Week 4",
                      title: "Full-Length Bar Raiser Timed Simulations",
                      desc: "45-minute continuous mock interviews with eye-contact monitoring, voice confidence pacing, and live AI grilling.",
                      drills: ["End-to-end Staff System Design", "Live behavioral probe", "Rapid retrospective synthesis"],
                      status: "Upcoming",
                      color: "border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900"
                    }
                  ]).map((w, i) => (
                    <div key={i} className={`p-6 rounded-2xl border ${w.color} shadow-sm space-y-4`}>
                      <div className="flex items-center justify-between">
                        <span className="font-mono text-xs font-bold text-blue-600 dark:text-blue-400 uppercase tracking-wider">{w.week}</span>
                        <span className="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300">
                          {w.status}
                        </span>
                      </div>
                      <h3 className="font-bold text-base text-slate-900 dark:text-white">{w.title}</h3>
                      <p className="text-xs text-slate-600 dark:text-slate-400 leading-relaxed">{w.desc}</p>
                      
                      <div className="space-y-1.5 pt-1">
                        <span className="text-[11px] font-semibold text-slate-500 uppercase tracking-wide">Key Focus Drills:</span>
                        <ul className="space-y-1 text-xs text-slate-700 dark:text-slate-300">
                          {w.drills.map((drill, dIdx) => (
                            <li key={dIdx} className="flex items-center gap-2">
                              <span className="text-blue-500">•</span>
                              <span>{drill}</span>
                            </li>
                          ))}
                        </ul>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-4">
                  <div>
                    <h4 className="font-bold text-sm text-slate-900 dark:text-white">
                      {resumeParsed ? "Ready to practice your tailored questions?" : "Ready to test Week 2 competencies?"}
                    </h4>
                    <p className="text-xs text-slate-500">
                      {resumeParsed ? "Use the interview questions generated from your resume analysis." : "Run a simulated rate-limiting & caching scenario with real-time feedback."}
                    </p>
                  </div>
                  <button
                    onClick={() => {
                      resetInterviewReview();
                      setSessionStage(0);
                      if (resumeParsed && resumeQuestions.length) {
                        setUseResumeQuestions(true);
                        setSessionStage(0);
                        setActiveQuestion(resumeQuestions[0]);
                      }
                      setCurrentView("simulator");
                    }}
                    className="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs shadow-md shadow-blue-500/25 flex items-center gap-1.5"
                  >
                    <span>{resumeParsed ? "Practice Tailored Questions" : "Launch Scenario Simulation"}</span>
                    <Icon name="arrow-right" className="w-3.5 h-3.5" />
                  </button>
                </div>
              </div>
            )}

            {/* VIEW 4: LIVE SIMULATOR (CAMERA, AI AVATAR, STT/TTS) */}
            {currentView === "simulator" && (

                {/* Simulator Control Bar */}
                <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm">
                  <div className="flex items-center gap-3">
                    <span className="px-3 py-1 rounded-lg text-xs font-bold bg-blue-50 dark:bg-blue-950/80 text-blue-600 dark:text-blue-400 border border-blue-200 dark:border-blue-800">
                      Round {sessionStage + 1} of 5
                    </span>
                    <span className="text-xs font-semibold text-slate-700 dark:text-slate-300">
                      {activeQuestion?.stage || "Technical Assessment"}
                    </span>
                    {useResumeQuestions && (
                      <span className="text-[11px] px-2 py-0.5 rounded-full bg-amber-50 dark:bg-amber-950/80 text-amber-600 dark:text-amber-400 border border-amber-200 dark:border-amber-800 font-semibold">

                      </span>

                  <div className="flex items-center gap-2.5 self-end sm:self-auto flex-wrap">

                      <span className="flex items-center gap-1 text-slate-600 dark:text-slate-400">
                        <Icon name="eye" className="w-3.5 h-3.5 text-blue-500" />

                      </span>
                      <span className="text-slate-300 dark:text-slate-700">|</span>
                      <span className="text-slate-600 dark:text-slate-400">

                      </span>
                    </div>

                    {/* Auto TTS Toggle */}
                    <button
                      onClick={() => setAutoSpeakQuestion(!autoSpeakQuestion)}
                      className={`px-3 py-1.5 rounded-xl border text-xs font-medium flex items-center gap-1.5 transition-all ${
                        autoSpeakQuestion
                          ? "bg-indigo-50 dark:bg-indigo-950/80 border-indigo-200 dark:border-indigo-800 text-indigo-600 dark:text-indigo-400 font-semibold"

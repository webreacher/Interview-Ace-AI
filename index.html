                      title="Auto read questions aloud"
                    >
                      <Icon name={autoSpeakQuestion ? "volume-2" : "volume-x"} className="w-3.5 h-3.5" />
                      <span>Auto-TTS</span>
                    </button>

                    {/* Timer */}
                    <div className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl border font-mono text-xs font-bold ${
                      timerSeconds < 30 
                        ? "bg-red-50 dark:bg-red-950/80 border-red-200 dark:border-red-800 text-red-600 dark:text-red-400 animate-pulse" 
                        : "bg-slate-50 dark:bg-slate-950 border-slate-200 dark:border-slate-800 text-slate-800 dark:text-slate-200"
                    }`}>
                      <Icon name="clock" className="w-3.5 h-3.5" />
                      <span>{formatTime(timerSeconds)}</span>
                    </div>

                    <button 
                      onClick={() => setIsTimerRunning(!isTimerRunning)} 
                      className="p-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 text-slate-600 dark:text-slate-300"
                      title="Pause / Resume"
                    >
                      <Icon name={isTimerRunning ? "pause" : "play"} className="w-3.5 h-3.5" />
                    </button>

                    <button
                      onClick={() => {
                        const nextStage = (sessionStage + 1) % 5;
                        setSessionStage(nextStage);
                        loadQuestionForStage(nextStage);
                        setUserResponse("");
                      }}
                      className="px-3 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 dark:bg-slate-800 dark:hover:bg-slate-700 text-white text-xs font-semibold flex items-center gap-1"
                    >
                      <span>Next Round</span>
                      <Icon name="chevron-right" className="w-3.5 h-3.5" />
                    </button>
                  </div>
                </div>

                {/* Video Stage Feeds */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                  
                  {/* AI Interviewer Video Card */}
                  <div className="relative aspect-video rounded-3xl bg-slate-900 text-white border border-slate-800 p-5 flex flex-col justify-between overflow-hidden shadow-lg">
                    {/* Feed Top Overlay */}
                    <div className="flex items-center justify-between z-10">
                      <div className="flex items-center gap-2">
                        <span className={`w-2.5 h-2.5 rounded-full ${isSpeaking ? 'bg-indigo-400 animate-ping' : 'bg-emerald-500'}`}></span>
                        <span className="text-xs font-semibold text-slate-200">Dr. Sarah Vance (Executive Bar Raiser)</span>
                      </div>
                      
                      <div className="flex items-center gap-2">
                        <button
                          onClick={() => {
                            if (isSpeaking) {
                              stopTTS();
                            } else {
                              speakText(`${activeQuestion?.title}. ${activeQuestion?.description}`);
                            }
                          }}
                          className={`px-3 py-1 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition-all ${
                            isSpeaking 
                              ? "bg-red-500/20 text-red-300 border border-red-500/40 animate-pulse" 
                              : isGeneratingAudio
                              ? "bg-indigo-500/20 text-indigo-300 border border-indigo-500/40"
                              : "bg-indigo-600/40 text-indigo-200 border border-indigo-500/50 hover:bg-indigo-600/60"
                          }`}
                        >
                          <Icon name={isSpeaking ? "volume-x" : isGeneratingAudio ? "loader-2" : "volume-2"} className={`w-3.5 h-3.5 ${isGeneratingAudio ? 'animate-spin' : ''}`} />
                          <span>{isSpeaking ? "Stop Voice" : isGeneratingAudio ? "Generating..." : "TTS Read"}</span>
                        </button>
                      </div>
                    </div>

                    {/* Center Avatar & Lip-Sync Visualizer */}
                    <div className="my-auto flex flex-col items-center justify-center z-10">
                      <div className="relative">
                        <div className={`w-24 h-24 rounded-full bg-gradient-to-tr from-blue-500 via-indigo-500 to-pink-500 p-1 shadow-2xl ${isSpeaking || isAIEvaluating ? 'recording-ring ring-4 ring-indigo-500/40' : ''}`}>
                          <div className="w-full h-full rounded-full bg-slate-950 flex items-center justify-center overflow-hidden">
                            <img 
                              src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=400&q=80" 
                              alt="AI Interviewer" 
                              className={`w-full h-full object-cover filter transition-all ${isSpeaking ? 'brightness-110 scale-105' : 'brightness-90'}`}
                            />
                          </div>
                        </div>
                      </div>

                      {/* Waveform Bars */}
                      <div className="flex items-center gap-1.5 mt-3.5 h-6">
                        {[25, 70, 40, 90, 55, 80, 35, 95, 60, 45, 75, 30].map((h, i) => (
                          <span 
                            key={i} 
                            className={`w-1 rounded-full transition-all duration-150 ${
                              isSpeaking ? 'bg-gradient-to-t from-blue-400 to-indigo-300' : 'bg-slate-800'
                            }`} 
                            style={{ 
                              height: isSpeaking ? `${Math.max(20, (h + (i % 3) * 15) % 100)}%` : '18%'
                            }}
                          />
                        ))}
                      </div>
                      {isSpeaking && (
                        <span className="text-[11px] text-indigo-300 font-medium tracking-wide mt-1 animate-pulse">
                          Speaking question aloud...
                        </span>
                      )}
                    </div>

                    {/* Question Subtitle Card */}
                    <div className="z-10 bg-slate-950/80 backdrop-blur-md rounded-2xl p-3.5 border border-slate-800 text-xs text-slate-300 flex items-center justify-between">
                      <div className="line-clamp-2">
                        <span className="font-semibold text-blue-400 mr-1.5">Prompt:</span>
                        {activeQuestion?.title}
                      </div>
                      <button
                        onClick={() => speakText(`${activeQuestion?.title}. ${activeQuestion?.description}`)}
                        className="ml-3 shrink-0 p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300"
                        title="Re-read"
                      >
                        <Icon name="volume-2" className="w-3.5 h-3.5" />
                      </button>
                    </div>
                  </div>

                  {/* Candidate Video Stage Feed */}
                  <div className={`relative aspect-video rounded-3xl bg-slate-900 border transition-all duration-300 overflow-hidden flex flex-col justify-between shadow-lg ${
                    isRecording ? 'border-red-500/80 mic-live-glow' : 'border-slate-800'
                  }`}>
                    {cameraActive ? (
                      <video 
                        ref={videoRef} 
                        autoPlay 
                        playsInline 
                        muted 
                        className="absolute inset-0 w-full h-full object-cover mirror scale-x-[-1]"
                      />
                    ) : (
                      <div className="absolute inset-0 flex flex-col items-center justify-center bg-slate-950 text-slate-500">
                        <Icon name="video-off" className="w-10 h-10 mb-2 text-slate-600" />
                        <p className="text-xs">Webcam feed disabled</p>
                      </div>
                    )}

                    {/* Candidate Top Status */}
                    <div className="relative z-10 p-4 flex items-center justify-between bg-gradient-to-b from-black/70 to-transparent">
                      <div className="flex items-center gap-2">
                        <span className={`w-2.5 h-2.5 rounded-full ${isRecording ? 'bg-red-500 animate-ping' : 'bg-slate-400'}`}></span>
                        <span className="text-xs font-semibold text-white drop-shadow">You (Candidate)</span>
                      </div>
                      {isRecording && (
                        <span className="px-3 py-1 rounded-full bg-red-600 text-white text-[11px] font-mono font-bold tracking-wider animate-pulse flex items-center gap-1.5 shadow-md">
                          <span className="w-2 h-2 rounded-full bg-white"></span>
                          MICROPHONE LIVE
                        </span>
                      )}
                    </div>

                    {cameraActive && cameraNotice && (
                      <div
                        role="status"
                        aria-live="polite"
                        className={`absolute inset-x-4 top-1/2 z-10 -translate-y-1/2 rounded-xl border px-3 py-2 text-center text-xs ${
                          cameraNotice.type === "warning"
                            ? "border-amber-400/60 bg-black/80 text-amber-200"
                            : "border-white/20 bg-black/70 text-white"
                        }`}
                      >
                        {cameraNotice.text}
                      </div>
                    )}

                    {/* Candidate Bottom Controls */}
                    <div className="relative z-10 p-3.5 bg-gradient-to-t from-black/90 via-black/50 to-transparent flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        <button 
                          onClick={() => setCameraActive(active => !active)}
                          aria-label={cameraActive ? "Turn camera off" : "Turn camera on"}
                          aria-pressed={cameraActive}
                          className="p-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-white transition-all text-xs"
                          title={cameraActive ? "Turn camera off" : "Turn camera on"}
                        >
                          <Icon name={cameraActive ? "video" : "video-off"} className="w-4 h-4" />
                        </button>
                        
                        {/* Live STT Toggle */}
                        <button 
                          onClick={toggleSpeechToText}
                          aria-pressed={isRecording}
                          disabled={isPreparingSpeech}
                          className={`px-4 py-2 rounded-xl flex items-center gap-2 text-xs font-semibold transition-all shadow-md ${
                            isPreparingSpeech
                              ? 'bg-blue-600/70 text-white cursor-wait'
                              : isRecording 
                              ? 'bg-red-600 hover:bg-red-700 text-white shadow-red-600/30 animate-pulse' 
                              : 'bg-blue-600 hover:bg-blue-500 text-white shadow-blue-600/25'
                          }`}
                        >
                          <Icon name={isPreparingSpeech ? "loader" : isRecording ? "square" : "mic"} className={`w-4 h-4 ${isPreparingSpeech ? "animate-spin" : ""}`} />
                          <span>{isPreparingSpeech ? "Loading Local STT..." : isRecording ? "Stop Recording" : "Start Mic (STT)"}</span>
                        </button>
                      </div>

                      {/* Live Audio Level Meter */}
                      {isRecording ? (
                        <div className="flex items-center gap-2 bg-black/60 px-3 py-1.5 rounded-xl border border-red-500/40">
                          <span className="text-[10px] text-red-400 font-mono font-bold">STT LEVEL</span>
                          <div className="flex items-center gap-1 h-3.5">
                            {[20, 50, 90, 40, 75].map((base, idx) => (
                              <span 
                                key={idx}
                                className={`w-1 rounded-full transition-all duration-75 ${audioLevel > 15 ? 'bg-emerald-400' : 'bg-red-500'}`}
                                style={{ height: `${Math.max(20, Math.min(100, (audioLevel > 10 ? (base * audioLevel) / 60 : 20)))}%` }}
                              />
                            ))}
                          </div>
                        </div>
                      ) : (
                        <div className="text-[11px] text-slate-300 font-mono bg-black/40 px-2.5 py-1 rounded-lg">
                          On-device speech recognition
                        </div>
                      )}
                    </div>
                  </div>

                </div>

                {/* Response Workspace & Instant Coaching Card */}
                <div className="p-6 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
                  
                  {/* Prompt details */}
                  <div className="border-b border-slate-200 dark:border-slate-800 pb-4">
                    <div className="flex items-center gap-2 mb-1 flex-wrap">
                      <span className="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-blue-50 dark:bg-blue-950 text-blue-600 dark:text-blue-400 border border-blue-200 dark:border-blue-800">
                        {activeQuestion?.stage}
                      </span>
                      <span className="text-xs text-slate-500 dark:text-slate-400">Target Role: {level} {role}</span>
                    </div>
                    <h2 className="text-xl font-bold text-slate-900 dark:text-white mt-1">{activeQuestion?.title}</h2>
                    <p className="text-sm text-slate-600 dark:text-slate-300 mt-1 leading-relaxed">{activeQuestion?.description}</p>
                  </div>

                  {/* Instant In-Line Coach Roast if active */}
                  {instantFeedback && (
                    <div className="p-4 rounded-2xl bg-gradient-to-r from-amber-500/10 via-orange-500/5 to-indigo-500/10 border border-amber-300 dark:border-amber-800/80 text-xs space-y-2">
                      <div className="flex items-center justify-between">
                        <div className="flex items-center gap-2 font-bold text-amber-600 dark:text-amber-400">
                          <Icon name="flame" className="w-4 h-4" />
                          <span>Instant Live Critique</span>
                        </div>
                        <div className="flex items-center gap-2">
                          <span className="px-2 py-0.5 rounded-md bg-white dark:bg-slate-950 font-bold text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-800">
                            Verdict: <strong className="text-amber-600 dark:text-amber-400">{instantFeedback.verdict}</strong>
                          </span>
                          <span className="font-mono font-bold text-amber-600 dark:text-amber-400 text-sm">{instantFeedback.quickScore}/100</span>
                          <button onClick={() => setInstantFeedback(null)} className="text-slate-400 hover:text-slate-600 dark:hover:text-white ml-1">✕</button>
                        </div>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-3 pt-1">
                        <div>
                          <span className="font-semibold text-slate-700 dark:text-slate-300">Actionable Suggestions:</span>
                          <ul className="mt-1 space-y-1 text-slate-600 dark:text-slate-400">
                            {instantFeedback.instantTips?.map((tip, i) => (
                              <li key={i} className="flex items-start gap-1.5">
                                <span className="text-amber-500 font-bold">•</span>
                                <span>{tip}</span>
                              </li>
                            ))}
                          </ul>
                        </div>
                        <div>
                          <span className="font-semibold text-slate-700 dark:text-slate-300">Signal Keywords to Include:</span>
                          <div className="flex flex-wrap gap-1.5 mt-1">
                            {instantFeedback.missingKeywords?.map((kw, i) => (
                              <span key={i} className="px-2 py-0.5 rounded bg-white dark:bg-slate-950 text-indigo-600 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-800 text-[11px] font-medium">
                                +{kw}
                              </span>
                            ))}
                          </div>
                          <p className="mt-2 text-slate-500 dark:text-slate-400 italic text-[11px]">"{instantFeedback.encouragement}"</p>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* Speech input textarea */}
                  <div className="space-y-2">
                    <div className="flex items-center justify-between text-xs text-slate-500 dark:text-slate-400">
                      <label className="font-semibold text-slate-700 dark:text-slate-300 flex items-center gap-2">
                        <Icon name="edit-3" className="w-3.5 h-3.5 text-blue-500" />
                        <span>Transcribed Answer & Architecture Notes:</span>
                        {isRecording && (
                          <span className="text-red-500 font-mono animate-pulse flex items-center gap-1">
                            <span className="w-1.5 h-1.5 rounded-full bg-red-500"></span>
                            Listening live to microphone...
                          </span>
                        )}
                      </label>
                      <span className="font-mono">{userResponse.trim().split(/\s+/).filter(Boolean).length} words</span>
                    </div>

                    <textarea
                      value={userResponse}
                      onChange={(e) => setUserResponse(e.target.value)}
                      placeholder="Click 'Start Mic (STT)' to speak naturally, or type your answer here... Walk through architecture components, bottlenecks, metrics, and trade-offs."
                      rows={6}
                      className={`w-full bg-slate-50 dark:bg-slate-950 border rounded-2xl p-4 text-sm text-slate-800 dark:text-slate-200 placeholder-slate-400 focus:outline-none transition-all leading-relaxed ${
                        isRecording 
                          ? 'border-red-400 ring-2 ring-red-400/20' 
                          : 'border-slate-200 dark:border-slate-800 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500'
                      }`}
                    />
                  </div>

                  {speechNotice && (
                    <div
                      role="status"
                      aria-live="polite"
                      className={`rounded-xl border px-3 py-2 text-xs ${
                        speechNotice.type === "warning"
                          ? "border-amber-300 bg-amber-50 text-amber-800 dark:border-amber-800 dark:bg-amber-950/40 dark:text-amber-300"
                          : "border-blue-300 bg-blue-50 text-blue-800 dark:border-blue-800 dark:bg-blue-950/40 dark:text-blue-300"
                      }`}
                    >
                      {speechNotice.text}
                    </div>
                  )}

                  {/* Footer Action Row */}
                  <div className="flex flex-col sm:flex-row items-center justify-between gap-4 pt-2">
                    <div className="text-xs text-slate-500 dark:text-slate-400 flex items-center gap-1.5">
                      <Icon name="info" className="w-4 h-4 text-blue-500 shrink-0" />
                      <span>Bar Target: {activeQuestion?.criteria}</span>
                    </div>

                    <div className="flex items-center gap-2.5 w-full sm:w-auto flex-wrap">
                      <button
                        onClick={handleInstantFeedback}
                        disabled={isGeneratingInstantFeedback || !userResponse.trim()}
                        className="px-4 py-2.5 rounded-xl border border-amber-300 dark:border-amber-800/80 bg-amber-50 dark:bg-amber-950/60 hover:bg-amber-100 dark:hover:bg-amber-900/60 text-amber-700 dark:text-amber-300 text-xs font-semibold flex items-center gap-1.5 transition-all disabled:opacity-40"
                      >
                        <Icon name={isGeneratingInstantFeedback ? "loader-2" : "flame"} className={`w-3.5 h-3.5 ${isGeneratingInstantFeedback ? 'animate-spin' : ''}`} />
                        <span>Instant Coach Roast</span>
                      </button>

                      <button
                        onClick={() => setUserResponse("")}
                        disabled={!userResponse}
                        className="px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-800 text-xs text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 disabled:opacity-40"
                      >
                        Clear
                      </button>

                      <button
                        onClick={handleEvaluateResponse}
                        disabled={isAIEvaluating || !userResponse.trim()}
                        className="flex-1 sm:flex-initial px-6 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs flex items-center justify-center gap-2 shadow-md shadow-blue-500/30 disabled:opacity-50 transition-all active:scale-95"
                      >
                        {isAIEvaluating ? (
                          <>
                            <Icon name="loader" className="w-4 h-4 animate-spin text-white" />
                            <span>Scoring Against Interview Rubric...</span>
                          </>
                        ) : (
                          <>
                            <Icon name="sparkles" className="w-4 h-4 text-white" />
                            <span>Submit for Evaluation</span>
                          </>
                        )}
                      </button>
                    </div>
                  </div>

                </div>

              </div>
            )}

            {/* VIEW 5: EVALUATION SCORECARD */}
            {currentView === "report" && latestFeedback && (
              <div className="max-w-4xl mx-auto px-4 sm:px-6 py-10 space-y-6">
                
                {/* Scorecard Hero Banner */}
                <div className="p-6 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
                  <div>
                    <div className="flex items-center gap-2 mb-2">
                      <span className={`px-3 py-1 rounded-full text-xs font-bold ${
                        latestFeedback.hiringRecommendation === "Strong Hire" 
                          ? "bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-400 border border-emerald-300 dark:border-emerald-800"
                          : latestFeedback.hiringRecommendation === "Hire"
                          ? "bg-blue-100 dark:bg-blue-950 text-blue-700 dark:text-blue-400 border border-blue-300 dark:border-blue-800"
                          : "bg-amber-100 dark:bg-amber-950 text-amber-700 dark:text-amber-400 border border-amber-300 dark:border-amber-800"
                      }`}>
                        {latestFeedback.hiringRecommendation}
                      </span>
                      <span className="text-xs text-slate-500">{level} {role} Standard</span>
                    </div>
                    <h2 className="text-2xl font-bold text-slate-900 dark:text-white tracking-tight">
                      {isFinalReview ? "Final Interview Review" : "Answer Evaluation"}
                    </h2>
                    <p className="text-sm text-slate-600 dark:text-slate-300 mt-1 max-w-xl leading-relaxed">{latestFeedback.summary}</p>
                    <p className="text-[11px] text-slate-500 dark:text-slate-400 mt-2">
                      Scores are local rubric estimates based on answer relevance, evidence, and structure; they are not an AI-verified assessment of technical correctness.
                    </p>
                    
                    <button
                      onClick={() => speakText(`Here is your interview assessment. Hiring recommendation: ${latestFeedback.hiringRecommendation}. Overall score: ${latestFeedback.overallScore} out of 100. Summary: ${latestFeedback.summary}`)}
                      className="mt-3.5 inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-indigo-50 dark:bg-indigo-950/80 hover:bg-indigo-100 text-indigo-600 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-800 text-xs font-semibold"
                    >
                      <Icon name={isSpeaking ? "volume-x" : "volume-2"} className="w-3.5 h-3.5" />
                      <span>{isSpeaking ? "Stop Voice" : "TTS Listen to Summary"}</span>
                    </button>
                  </div>

                  <div className="h-24 w-24 rounded-2xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 flex flex-col items-center justify-center shrink-0">
                    <span className="text-4xl font-extrabold text-blue-600 dark:text-blue-400 font-mono">{latestFeedback.overallScore}</span>
                    <span className="text-[10px] text-slate-400 uppercase font-bold">/ 100</span>
                  </div>
                </div>

                {/* Dimension Scores */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-2">
                    <div className="flex justify-between text-xs text-slate-500 font-semibold">
                      <span>{selectedTrack === "Behavioral" ? "Situation & Action" : selectedTrack === "HR" ? "Role Alignment" : "Question Relevance"}</span>
                      <span className="font-mono text-blue-600 dark:text-blue-400 font-bold">{latestFeedback.technicalScore}%</span>
                    </div>
                    <div className="w-full bg-slate-100 dark:bg-slate-800 h-2 rounded-full overflow-hidden">
                      <div className="bg-blue-500 h-full rounded-full" style={{ width: `${latestFeedback.technicalScore}%` }}></div>
                    </div>
                  </div>

                  <div className="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-2">
                    <div className="flex justify-between text-xs text-slate-500 font-semibold">
                      <span>Structure & Evidence</span>
                      <span className="font-mono text-indigo-600 dark:text-indigo-400 font-bold">{latestFeedback.structureScore}%</span>
                    </div>
                    <div className="w-full bg-slate-100 dark:bg-slate-800 h-2 rounded-full overflow-hidden">
                      <div className="bg-indigo-500 h-full rounded-full" style={{ width: `${latestFeedback.structureScore}%` }}></div>
                    </div>
                  </div>

                  <div className="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-2">
                    <div className="flex justify-between text-xs text-slate-500 font-semibold">
                      <span>Clarity & Concision</span>
                      <span className="font-mono text-emerald-600 dark:text-emerald-400 font-bold">{latestFeedback.deliveryScore}%</span>
                    </div>
                    <div className="w-full bg-slate-100 dark:bg-slate-800 h-2 rounded-full overflow-hidden">
                      <div className="bg-emerald-500 h-full rounded-full" style={{ width: `${latestFeedback.deliveryScore}%` }}></div>
                    </div>
                  </div>
                </div>

                {isFinalReview && (
                  <div className="p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-3">
                    <h3 className="font-bold text-sm text-slate-900 dark:text-white">Question-by-question results</h3>
                    <div className="space-y-3">
                      {transcriptHistory.map((item, index) => (
                        <div key={`${index}-${item.question}`} className="rounded-xl border border-slate-200 dark:border-slate-800 p-4">
                          <div className="flex items-start justify-between gap-3">
                            <p className="text-sm font-semibold text-slate-800 dark:text-slate-200">{index + 1}. {item.question}</p>
                            <span className="shrink-0 font-mono font-bold text-blue-600 dark:text-blue-400">{item.feedback.overallScore}/100</span>
                          </div>
                          <p className="mt-2 text-xs text-slate-500 dark:text-slate-400">{item.feedback.hiringRecommendation} · {item.feedback.summary}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div className="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
                    <h3 className="font-bold text-sm text-slate-900 dark:text-white">Evidence recognized</h3>
                    <ul className="mt-3 space-y-2 text-xs text-slate-600 dark:text-slate-300">
                      {latestFeedback.strengths.map((strength, index) => <li key={index}>• {strength}</li>)}
                    </ul>
                  </div>
                  <div className="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
                    <h3 className="font-bold text-sm text-slate-900 dark:text-white">What to improve</h3>
                    <ul className="mt-3 space-y-2 text-xs text-slate-600 dark:text-slate-300">
                      {latestFeedback.improvements.map((improvement, index) => <li key={index}>• {improvement}</li>)}
                    </ul>
                  </div>
                </div>

                {/* Question-specific answer guidance */}
                <div className="p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-3">
                  <div className="flex items-center justify-between">
                    <h3 className="font-bold text-sm text-slate-900 dark:text-white flex items-center gap-2">
                      <Icon name="book-open" className="w-4 h-4 text-blue-500" />
                      <span>What a strong answer should include</span>
                    </h3>
                    <button
                      onClick={() => speakText(latestFeedback.modelAnswer)}
                      className="px-3 py-1 rounded-lg bg-blue-50 dark:bg-blue-950 text-blue-600 dark:text-blue-400 text-xs font-semibold"
                    >
                      Listen via TTS
                    </button>
                  </div>
                  <div className="p-4 rounded-xl bg-slate-50 dark:bg-slate-950 text-xs font-mono text-slate-700 dark:text-slate-300 leading-relaxed border border-slate-200 dark:border-slate-800">
                    {latestFeedback.modelAnswer}
                  </div>
                </div>

                {/* Bottom navigation */}
                <div className="flex items-center justify-between pt-2">
                  <button
                    onClick={() => setCurrentView("simulator")}
                    className="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-800 text-xs font-semibold text-slate-700 dark:text-slate-300"
                  >
                    {isFinalReview ? "← Back to Last Question" : "← Back to Simulator"}
                  </button>

                  {isFinalReview ? (
                    <button
                      onClick={() => startMockInterviewWithTrack(selectedTrack)}
                      className="px-6 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs shadow-md shadow-blue-500/25 flex items-center gap-1.5"
                    >
                      <span>Start New Interview</span>
                      <Icon name="arrow-right" className="w-3.5 h-3.5" />
                    </button>
                  ) : (
                    <button
                      onClick={() => {
                        const lastStage = useResumeQuestions ? Math.min(Math.max(resumeQuestions.length, 1), 5) - 1 : 4;
                        if (sessionStage >= lastStage) {
                          const feedback = aggregateInterviewFeedback(transcriptHistory);
                          setLatestFeedback(feedback);
                          setIsFinalReview(true);
                          const totalSeconds = transcriptHistory.reduce((total, item) => total + (item.durationSeconds || 0), 0);
                          setSavedSessions(prev => [{
                            id: `sess-${Date.now()}`,
                            date: "Just now",
                            role: `${level} ${role}`,
                            score: feedback.overallScore,
                            scores: {
                              technical: feedback.technicalScore,
                              structure: feedback.structureScore,
                              communication: feedback.deliveryScore
                            },
                            duration: `${Math.floor(totalSeconds / 60)}m ${totalSeconds % 60}s`,
                            status: feedback.hiringRecommendation
                          }, ...prev]);
                          setCurrentView("report");
                          return;
                        }
                        const next = sessionStage + 1;
                        setSessionStage(next);
                        setIsFinalReview(false);
                        loadQuestionForStage(next);
                        setUserResponse("");
                        setCurrentView("simulator");
                      }}
                      className="px-6 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs shadow-md shadow-blue-500/25 flex items-center gap-1.5"
                    >
                      <span>
                        {sessionStage >= (useResumeQuestions ? Math.min(Math.max(resumeQuestions.length, 1), 5) - 1 : 4)
                          ? "View Final Review"
                          : "Proceed to Next Round"}
                      </span>
                      <Icon name="arrow-right" className="w-3.5 h-3.5" />
                    </button>
                  )}
                </div>

              </div>
            )}

            {/* VIEW 6: QUESTION BANK */}
            {currentView === "bank" && (
              <div className="max-w-5xl mx-auto px-4 sm:px-6 py-10 space-y-6">
                <div>
                  <h2 className="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Curated FAANG Question Bank</h2>
                  <p className="text-sm text-slate-600 dark:text-slate-400 mt-1">High-frequency system design and architecture drills.</p>
                </div>

                <div className="grid grid-cols-1 gap-4">
                  {QUESTION_BANK.map((q) => (
                    <div key={q.id} className="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-blue-400 dark:hover:border-blue-500 transition-all space-y-3 shadow-sm">
                      <div className="flex items-center justify-between flex-wrap gap-2">
                        <div className="flex items-center gap-2">
                          <span className="px-2.5 py-0.5 rounded-md text-xs font-semibold bg-blue-50 dark:bg-blue-950 text-blue-600 dark:text-blue-400">
                            {q.role}
                          </span>
                          <span className="text-xs text-slate-500">{q.category}</span>
                        </div>
                        <button
                          onClick={() => speakText(`${q.title}. ${q.description}`)}
                          className="px-3 py-1 rounded-lg text-xs font-semibold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300"
                        >
                          TTS Preview
                        </button>
                      </div>

                      <h3 className="font-bold text-base text-slate-900 dark:text-white">{q.title}</h3>
                      <p className="text-xs text-slate-600 dark:text-slate-400 leading-relaxed">{q.description}</p>

                      <div className="flex justify-end pt-1">
                        <button
                          onClick={() => {
                            resetInterviewReview();
                            setUseResumeQuestions(false);
                            setSessionStage(0);
                            setActiveQuestion({
                              stage: q.category,
                              title: q.title,
                              description: q.description,
                              criteria: q.keyPoints.join(", ")
                            });
                            setTimerSeconds(180);
                            setUserResponse("");
                            setCurrentView("simulator");
                          }}
                          className="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs shadow-sm flex items-center gap-1.5"
                        >
                          <span>Launch This Drill</span>
                          <Icon name="arrow-right" className="w-3.5 h-3.5" />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* VIEW 7: ROLE & ENGINE SETUP */}
            {currentView === "setup" && (
              <div className="max-w-4xl mx-auto px-4 sm:px-6 py-10 space-y-6">
                <div>
                  <h2 className="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Role & Voice Persona Settings</h2>
                  <p className="text-sm text-slate-600 dark:text-slate-400 mt-1">Configure target seniority, domain track, and voice synthesis.</p>
                </div>

                <div className="p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-4 shadow-sm">
                  <h3 className="font-bold text-sm text-slate-900 dark:text-white">Gemini TTS Voice Persona</h3>
                  <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">
                    {[
                      { name: "Kore", desc: "Firm bar raiser" },
                      { name: "Puck", desc: "Upbeat peer" },
                      { name: "Zephyr", desc: "Conversational" },
                      { name: "Charon", desc: "Staff architect" },
                      { name: "Fenrir", desc: "Direct leader" }
                    ].map(v => (
                      <button
                        key={v.name}
                        onClick={() => {
                          setTtsVoice(v.name);
                          speakText(`Voice updated to ${v.name}. Ready for interview.`);
                        }}
                        className={`p-3 rounded-xl border text-left transition-all ${
                          ttsVoice === v.name
                            ? "bg-blue-50 dark:bg-blue-950 border-blue-500 text-blue-600 dark:text-blue-400 font-semibold"
                            : "bg-slate-50 dark:bg-slate-950 border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400"
                        }`}
                      >
                        <div className="text-xs font-bold">{v.name}</div>
                        <div className="text-[10px] text-slate-400 mt-0.5">{v.desc}</div>
                      </button>
                    ))}
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div className="p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-3 shadow-sm">
                    <label className="text-sm font-bold text-slate-900 dark:text-white">Target Discipline</label>
                    {["Software Engineering", "Data Engineering", "QA Automation", "Product Management"].map(r => (
                      <button
                        key={r}
                        onClick={() => setRole(r)}
                        className={`w-full p-3 rounded-xl border text-left text-xs font-semibold flex items-center justify-between transition-all ${
                          role === r 
                            ? "bg-blue-50 dark:bg-blue-950 border-blue-500 text-blue-600 dark:text-blue-400"
                            : "bg-slate-50 dark:bg-slate-950 border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400"
                        }`}
                      >
                        <span>{r}</span>
                        {role === r && <Icon name="check" className="w-4 h-4 text-blue-500" />}
                      </button>
                    ))}
                  </div>

                  <div className="p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-3 shadow-sm">
                    <label className="text-sm font-bold text-slate-900 dark:text-white">Seniority Level</label>
                    {["Junior (0-2 YOE)", "Mid-Level (3-5 YOE)", "Senior (5-8 YOE)", "Staff / Principal (8+ YOE)"].map(l => {
                      const base = l.split(" ")[0];
                      return (
                        <button
                          key={l}
                          onClick={() => setLevel(base)}
                          className={`w-full p-3 rounded-xl border text-left text-xs font-semibold flex items-center justify-between transition-all ${
                            level === base
                              ? "bg-indigo-50 dark:bg-indigo-950 border-indigo-500 text-indigo-600 dark:text-indigo-400"
                              : "bg-slate-50 dark:bg-slate-950 border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400"
                          }`}
                        >
                          <span>{l}</span>
                          {level === base && <Icon name="check" className="w-4 h-4 text-indigo-500" />}
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

          </main>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
